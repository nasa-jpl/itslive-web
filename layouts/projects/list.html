{{ define "main" }}
    <div class="container markdown top-pad">
        {{ .Content }}
    </div>
    <div class="container">
        <div class="project-section">
            <div class="project-grid{{ if .Site.Params.projects.useTwoColumns }} two-cols{{ end }}">
                {{ range .Pages.ByWeight }}
                {{ $width := "640x" }}
                {{ $href := .RelPermalink }}
                {{ with .Params.external_link }}{{ $href = . }}{{ end }}
                <a class="card project-card" href="{{ $href }}">
                    {{ if .Resources.ByType "image" }}
                    <div class="card-image">
                        <figure class="image is-3by2">
                            {{ with .Resources.ByType "image" }}
                            {{ range first 1 (sort . "Params.weight") }}
                            {{ $image := .Resize $width }}
                            <img src="{{ $image.RelPermalink }}" alt="{{ .Name }}">
                            {{ end }}
                            {{ end }}
                        </figure>
                    </div>
                    {{ end }}
                    <div class="card-content top-pad">
                        <h3>{{ .Title | markdownify }}</h3>
                    </div>
                </a>
                {{ end }}
            </div>
        </div>
    </div>
{{ end }}
